<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lilyco-42 —— 项目仪表盘</title>
<style>
:root {
  --sidebar:#171717; --main:#212121; --card:#2f2f2f; --card2:#383838;
  --edge:#ffffff1a; --fg:#ececec; --dim:#a3a3a3; --acc:#58a6ff; --ok:#3fb950;
}
* { box-sizing:border-box; margin:0; }
html, body { height:100%; }
body { display:flex; background:var(--main); color:var(--fg); font-family:"Segoe UI","Noto Sans SC",system-ui,sans-serif; overflow:hidden; }
a { color:var(--acc); text-decoration:none; }
a:hover { text-decoration:underline; }
button { font-family:inherit; }

/* ── 侧边栏 (ChatGPT/Kimi 布局) ── */
.sidebar { width:264px; min-width:264px; background:var(--sidebar); border-right:1px solid var(--edge); display:flex; flex-direction:column; padding:12px; gap:4px; }
.logo { display:flex; align-items:center; gap:.55rem; padding:.5rem .6rem .9rem; font-weight:600; }
.logo .avatar { width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,var(--acc),var(--purple,#bc8cff)); display:flex; align-items:center; justify-content:center; font-size:.85rem; color:#fff; }
.nav-item { display:flex; align-items:center; gap:.6rem; padding:.55rem .7rem; border-radius:10px; cursor:pointer; color:var(--dim); font-size:.88rem; user-select:none; }
.nav-item:hover { background:var(--card); color:var(--fg); }
.nav-item.on { background:var(--card); color:var(--fg); }
.nav-item .ic { width:1.1rem; text-align:center; }
.nav-sec { color:var(--dim); font-size:.7rem; padding:.9rem .7rem .3rem; letter-spacing:.05em; }
.side-search { background:var(--card); border:1px solid transparent; border-radius:10px; color:var(--fg); padding:.5rem .7rem; font-size:.83rem; outline:none; width:100%; }
.side-search:focus { border-color:var(--acc); }
.side-repos { flex:1; overflow-y:auto; margin-top:.3rem; }
.side-repo { padding:.45rem .7rem; border-radius:8px; font-size:.8rem; color:var(--dim); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.side-repo:hover { background:var(--card); color:var(--fg); }
.side-foot { border-top:1px solid var(--edge); padding-top:.7rem; font-size:.75rem; }
.side-foot a { color:var(--dim); display:flex; gap:.5rem; padding:.35rem .6rem; border-radius:8px; }
.side-foot a:hover { background:var(--card); color:var(--fg); }
.burger { display:none; }

/* ── 主内容区 ── */
.main { flex:1; overflow-y:auto; padding:2rem 2.4rem 3rem; }
.main-inner { max-width:860px; margin-inline:auto; }
.topbar { display:flex; align-items:center; gap:.8rem; margin-bottom:1.2rem; }
.burger-btn { display:none; background:var(--card); border:1px solid var(--edge); color:var(--fg); border-radius:8px; padding:.35rem .6rem; cursor:pointer; font-size:1rem; }
h1 { font-size:1.45rem; font-weight:600; }
.tagline { color:var(--dim); font-size:.9rem; margin-top:.25rem; }
.view { display:none; }
.view.on { display:block; }
.hcard { background:var(--card); border:1px solid var(--edge); border-radius:14px; padding:1.2rem 1.3rem; margin-bottom:.9rem; }
.hcard .icon { font-size:1.5rem; }
.hcard h2 { font-size:1.08rem; margin:.45rem 0 .45rem; }
.hcard h2 a { color:var(--fg); }
.hcard p { color:var(--dim); font-size:.87rem; line-height:1.65; margin-bottom:.65rem; }
.tags { margin-bottom:.75rem; }
.tag { display:inline-block; background:#ffffff0d; border:1px solid var(--edge); color:var(--acc); padding:2px 10px; border-radius:14px; font-size:.72rem; margin:2px 4px 2px 0; }
.btns { display:flex; gap:.5rem; flex-wrap:wrap; }
.btn { border:1px solid var(--edge); border-radius:10px; padding:.42rem .85rem; font-size:.8rem; color:var(--fg); background:transparent; cursor:pointer; }
.btn:hover { background:var(--card2); }
.btn.pri { background:var(--acc); border-color:var(--acc); color:#0d1117; font-weight:600; }
.btn.play { background:var(--ok); border-color:var(--ok); color:#0d1117; font-weight:600; }
.sec-title { font-size:.95rem; font-weight:600; margin:1.6rem 0 .8rem; }
.subapps { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:.7rem; }
.sapp { background:var(--card); border:1px solid var(--edge); border-radius:12px; padding:.85rem 1rem; color:var(--fg); display:block; }
.sapp:hover { background:var(--card2); }
.sapp b { font-size:.88rem; }
.sapp .d { color:var(--dim); font-size:.76rem; margin-top:.2rem; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:.8rem; }
.rcard { background:var(--card); border:1px solid var(--edge); border-radius:12px; padding:.9rem 1.05rem; }
.rcard h3 { font-size:.9rem; margin-bottom:.3rem; }
.rcard h3 a { color:var(--fg); }
.rcard p { color:var(--dim); font-size:.79rem; line-height:1.5; margin-bottom:.5rem; min-height:2.2em; }
.rcard .meta { display:flex; gap:.7rem; align-items:center; font-size:.72rem; color:var(--dim); }
.dot { width:.6rem; height:.6rem; border-radius:50%; display:inline-block; margin-right:.25rem; }
.langs { display:flex; gap:.4rem; flex-wrap:wrap; margin:.6rem 0 1rem; }
.lang { border:1px solid var(--edge); color:var(--dim); background:transparent; border-radius:16px; padding:.18rem .7rem; font-size:.74rem; cursor:pointer; }
.lang.on { border-color:var(--acc); color:var(--acc); }
.empty { color:var(--dim); padding:1rem; font-size:.85rem; }
footer { color:var(--dim); font-size:.76rem; margin-top:2rem; line-height:1.7; border-top:1px solid var(--edge); padding-top:1rem; }

@media (max-width: 860px) {
  .sidebar { position:fixed; left:0; top:0; bottom:0; z-index:10; transform:translateX(-100%); transition:transform .2s; }
  .sidebar.open { transform:translateX(0); }
  .burger-btn { display:block; }
  .main { padding:1.2rem 1.1rem 2rem; }
}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="logo"><span class="avatar">L</span> lilyco-42</div>
  <input class="side-search" id="q" placeholder="搜索仓库…">
  <div class="nav-item on" data-view="featured"><span class="ic">★</span> 精选项目</div>
  <div class="nav-item" data-view="apps"><span class="ic">◈</span> 本站应用</div>
  <div class="nav-item" data-view="repos"><span class="ic">▤</span> 全部仓库</div>
  <div class="nav-sec">快速入门</div>
  <div class="side-repos" id="side-guides"></div>
  <div class="side-foot">
    <a href="https://lilyco-42.github.io/mpkg-registry/" target="_blank"><span class="ic">📦</span> 记忆包市场</a>
    <a href="https://github.com/lilyco-42/lystack"><span class="ic">🗂</span> lystack 主仓</a>
  </div>
</aside>

<main class="main">
  <div class="main-inner">
    <div class="topbar"><button class="burger-btn" id="burger">☰</button><div>
      <h1 id="view-title">精选项目</h1>
      <div class="tagline">让人类远离计算机，AI 可做任何事 —— 工具调用与学习能力 &gt; scaling law。</div>
    </div></div>

    <div class="view on" id="v-featured"></div>

    <div class="view" id="v-apps">
      <div class="subapps" id="apps"></div>
    </div>

    <div class="view" id="v-repos">
      <div class="langs" id="langs"></div>
      <div class="grid" id="repos"><div class="empty">加载 GitHub 仓库…</div></div>
    </div>
  </div>
</main>

<script>
const OWNER = "lilyco-42";
const FEATURED = [
  { name: "lilyco", icon: "🧭", tags: ["AI 优先", "一套代码四端", "MCP 原生", "crates.io"],
    blurb: "让人类远离计算机 —— 一个 struct 生成 CLI/TUI/Web/MCP，天然可被 Agent 调用。已发布 crates.io。",
    links: [["GitHub →", "https://github.com/lilyco-42/lilyco"], ["crates.io", "https://crates.io/crates/lilyco"], ["快速入门", "guide.html?name=lilyco"]] },
  { name: "lyco-engine", icon: "🎨", tags: ["WASM", "视觉小说引擎"],
    blurb: "YuzuSoft 风格视觉小说引擎 + 资源流式后端，浏览器即玩。",
    links: [["GitHub →", "https://github.com/lilyco-42/lyco-engine"], ["在线玩", "/lyco/"], ["快速入门", "guide.html?name=lyco-engine"]] },
  { name: "cute-pet", icon: "🐱", tags: ["Rust", "WASM", "桌宠"],
    blurb: "丛雨桌宠 —— 跨平台悬浮桌宠，点击玩耍、聊天、看屏幕。",
    links: [["GitHub →", "https://github.com/lilyco-42/cute-pet"], ["立即游玩", "/pet/"], ["快速入门", "guide.html?name=cute-pet"]] },
  { name: "lyco-skill", icon: "🔍", tags: ["预研", "build-vs-buy"],
    blurb: "项目预研技能：需求一句话 → gh 近义词搜索 → 论坛冷门知识 → 决策。",
    links: [["GitHub →", "https://github.com/lilyco-42/lyco-skill"], ["快速入门", "guide.html?name=lyco-skill"]] },
  { name: "webview-mini", icon: "🪟", tags: ["C/C++", "200KB exe"],
    blurb: "极小 WebView2 封装 —— 单头文件，xmake 一键构建，对标 23KB Android 薄包装。",
    links: [["GitHub →", "https://github.com/lilyco-42/webview-mini"], ["快速入门", "guide.html?name=webview-mini"]] },
  { name: "webview-capi", icon: "🔌", tags: ["C API", "跨语言绑定"],
    blurb: "WebView2 C API —— 17 个导出函数，ctypes/cgo/FFI 绑定，30 秒上手。",
    links: [["GitHub →", "https://github.com/lilyco-42/webview-capi"], ["快速入门", "guide.html?name=webview-capi"]] },
  { name: "lyco_chat", icon: "💬", tags: ["transformer", "从零实现"],
    blurb: "研究 transformer 原理的聊天 AI —— tinyGPT 核心，注意力与自回归生成。",
    links: [["GitHub →", "https://github.com/lilyco-42/lyco_chat"], ["快速入门", "guide.html?name=lyco_chat"]] },
  { name: "lyco-cli", icon: "🛠", tags: ["脚手架", "gh api"],
    blurb: "统一多语言脚手架：gh api 拉模板 + 声明式渲染，一套配置生成骨架。",
    links: [["GitHub →", "https://github.com/lilyco-42/lyco-cli"], ["快速入门", "guide.html?name=lyco-cli"]] }
];
const APPS = [
  { n: "丛雨桌宠", d: "WASM 桌宠 · 即开即玩", u: "/pet/" },
  { n: "视觉小说引擎", d: "lyco-engine 在线 demo", u: "/lyco/" },
  { n: "lyco_chat", d: "transformer 聊天工具", u: "/tool/" },
  { n: "WASM demo", d: "C → WebAssembly 示例", u: "/wasm-demo/" }
];
const LANGC = { Rust: "#dea584", Python: "#3572A5", JavaScript: "#f1e05a", TypeScript: "#3178c6", "C++": "#f34b7d", C: "#8b8b8b", Java: "#b07219", Kotlin: "#A97BFF", Shell: "#89e051", HTML: "#e34c26", Go: "#00ADD8", Zig: "#ec915c", Lua: "#000080", Xmake: "#339999", Nushell: "#4E4E4E", "Jupyter Notebook": "#DA5B0B" };

// ── 视图切换 ──
let REPOS = [], LANG = "", Q = "";
const TITLES = { featured: "精选项目", apps: "本站应用", repos: "全部仓库" };
function switchView(v) {
  document.querySelectorAll(".view").forEach(function (x) { x.classList.remove("on"); });
  document.getElementById("v-" + v).classList.add("on");
  document.getElementById("view-title").textContent = TITLES[v];
  document.querySelectorAll(".nav-item").forEach(function (x) { x.classList.toggle("on", x.dataset.view === v); });
  document.getElementById("sidebar").classList.remove("open");
}

function renderFeatured() {
  document.getElementById("v-featured").innerHTML = FEATURED.map(function (f) {
    return '<div class="hcard"><div class="icon">' + f.icon + '</div><h2><a href="https://github.com/lilyco-42/' + f.name + '">' + f.name + '</a></h2>' +
      '<p>' + f.blurb + '</p><div class="tags">' + f.tags.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join("") + '</div>' +
      '<div class="btns">' + f.links.map(function (l, i) {
        const cls = i === 0 ? 'btn pri' : (l[0].indexOf("玩") >= 0 ? 'btn play' : 'btn');
        return '<a class="' + cls + '" href="' + l[1] + '"' + (l[1][0] === "/" ? '' : ' target="_blank"') + '>' + l[0] + '</a>';
      }).join("") + '</div></div>';
  }).join("");
}

function renderApps() {
  document.getElementById("apps").innerHTML = APPS.map(function (a) {
    return '<a class="sapp" href="' + a.u + '"><b>' + a.n + '</b><div class="d">' + a.d + '</div></a>';
  }).join("");
}

async function loadRepos() {
  const headers = {};
  if (localStorage.getItem("gh_token")) headers.Authorization = "Bearer " + localStorage.getItem("gh_token");
  try {
    const r = await fetch("https://api.github.com/users/" + OWNER + "/repos?per_page=100&sort=pushed", { headers: headers });
    REPOS = await r.json();
  } catch (e) { REPOS = []; }
  const langs = new Set();
  REPOS.forEach(function (r) { if (r.language) langs.add(r.language); });
  document.getElementById("langs").innerHTML =
    '<button class="lang on" data-l="">全部</button>' +
    Array.from(langs).sort().map(function (l) { return '<button class="lang" data-l="' + l + '">' + l + '</button>'; }).join("");
  document.querySelectorAll("#langs .lang").forEach(function (el) {
    el.addEventListener("click", function () {
      document.querySelectorAll("#langs .lang").forEach(function (x) { x.classList.remove("on"); });
      el.classList.add("on"); LANG = el.dataset.l; renderRepos();
    });
  });
  renderRepos();
  renderSideGuides();
}

function renderRepos() {
  const grid = document.getElementById("repos");
  const items = REPOS.filter(function (r) {
    if (r.fork) return false;
    if (LANG && r.language !== LANG) return false;
    if (Q && (r.name + " " + (r.description || "")).toLowerCase().indexOf(Q) < 0) return false;
    return true;
  });
  if (!items.length) { grid.innerHTML = '<div class="empty">无匹配仓库</div>'; return; }
  grid.innerHTML = items.map(function (r) {
    const c = LANGC[r.language] || "#8b949e";
    return '<div class="rcard"><h3><a href="' + r.html_url + '" target="_blank">' + r.name + '</a></h3>' +
      '<p>' + (r.description || "（无描述）") + '</p>' +
      '<div class="meta"><span><span class="dot" style="background:' + c + '"></span>' + (r.language || "-") + '</span>' +
      '<span>★ ' + r.stargazers_count + '</span><span>push ' + (r.pushed_at || "").slice(0, 10) + '</span></div></div>';
  }).join("");
}

function renderSideGuides() {
  document.getElementById("side-guides").innerHTML = Object.keys(FEATURED.reduce(function (o, f) {
    o[f.name] = 1; return o;
  }, {})).map(function (n) {
    return '<div class="side-repo" onclick="location=\'guide.html?name=' + n + '\'">' + n + '</div>';
  }).join("");
}

document.querySelectorAll(".nav-item").forEach(function (el) {
  el.addEventListener("click", function () { switchView(el.dataset.view); });
});
document.getElementById("burger").addEventListener("click", function () {
  document.getElementById("sidebar").classList.toggle("open");
});
document.getElementById("q").addEventListener("input", function (e) {
  Q = e.target.value.toLowerCase();
  switchView("repos");
  renderRepos();
});

renderFeatured();
renderApps();
loadRepos();
</script>
</body>
</html>
